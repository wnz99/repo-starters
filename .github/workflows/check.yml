name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [python, typescript, monorepo]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: 0.13.1
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - name: Copy an independent starter
        run: |
          mkdir "$RUNNER_TEMP/starter"
          cp -R "profiles/${{ matrix.profile }}/." "$RUNNER_TEMP/starter/"
          git -C "$RUNNER_TEMP/starter" init -q
          git -C "$RUNNER_TEMP/starter" add .
      - name: Install
        working-directory: ${{ runner.temp }}/starter
        run: sh tools/quality/setup.sh
      - name: Verify
        working-directory: ${{ runner.temp }}/starter
        run: sh tools/quality/check.sh
