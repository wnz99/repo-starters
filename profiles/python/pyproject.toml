[project]
name = "starter-python"
version = "0.1.0"
description = "Small typed input boundary to replace with project code"
requires-python = ">=3.14"
dependencies = ["pydantic==2.13.5"]

[dependency-groups]
test = ["pytest==9.1.1"]
dev = ["basedpyright==1.40.1", "clean-code-tools-python==1.0.7", "deptry==0.25.1", "packaging==26.3", "poethepoet==0.48.0", "pylint==4.0.8", "pytest==9.1.1", "pydantic==2.13.5", "ruff==0.16.8", "shellcheck-py==0.11.0.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starter_python"]

[tool.ruff]
extend = "./quality/pyproject.toml"

[tool.poe.executor]
type = "simple"

[tool.poe.tasks]
format = "ruff format --config ./quality/pyproject.toml src tests"
format-check = "ruff format --check --config ./quality/pyproject.toml src tests"
lint = "ruff check --no-fix --config ./quality/pyproject.toml src tests"
fix = "ruff check --fix --config ./quality/pyproject.toml src tests"
type-check = "basedpyright --project pyrightconfig.json"
deptry = "deptry src --config pyproject.toml --no-ansi"
test = "pytest -c ./quality/pyproject.toml --rootdir . tests"
build = "uv build --no-sources --out-dir dist"
dependency-isolation = "python ./tools/quality/isolate_python.py python-core"
check = ["check-static", "test", "build", "dependency-isolation"]
versions = "sh tools/quality/check-versions.sh"
hygiene = "sh tools/quality/hooks.sh hygiene"
helpers-format = "ruff format --check --config quality/pyproject.toml tools/quality"
helpers-lint = "ruff check --no-fix --config quality/pyproject.toml tools/quality"
helpers-types = "basedpyright --project pyrightconfig.tools.json"
helpers-pylint = "pylint --rcfile quality/pyproject.toml tools/quality"
helpers-deps = "deptry tools/quality --config pyproject.toml --known-first-party isolation_models --ignore DEP002,DEP004 --no-ansi"
helpers = ["helpers-format", "helpers-lint", "helpers-types", "helpers-pylint", "helpers-deps"]
check-static = ["versions", "hygiene", "shellcheck", "helpers", "format-check", "lint", "type-check", "pylint", "deptry"]
shellcheck = "uv tool run --from uv==0.13.1 uv tool run --from shellcheck-py==0.11.0.1 shellcheck .githooks/pre-commit .githooks/pre-push tools/quality/check-static.sh tools/quality/check-versions.sh tools/quality/check.sh tools/quality/format-index.sh tools/quality/hooks.sh tools/quality/install-hooks.sh tools/quality/setup.sh"
hooks-install = "sh tools/quality/install-hooks.sh"

[[tool.poe.tasks.pylint]]
cmd = "pylint --rcfile ./quality/pyproject.toml src"

[[tool.poe.tasks.pylint]]
cmd = "pylint --rcfile ./quality/pyproject.toml --disable=clean-code-business-policy-literal tests"
